<script>// Course content. Edit freely: each lecture = {t:title, pts:[bullets], w:widgetKey, q:[{q,o:[options],a:correctIndex,e:explanation}]}
const LECTURES=[
{t:"Review of Signals",w:"sig",pts:[
"A signal is a quantity (voltage, current, field…) varying with an independent variable such as time.",
"Key signals: sinusoid <code>A cos(2πf₀t+θ)</code>, unit step u(t), rectangular pulse Π(t), triangle Λ(t), sinc(t)=sin(πt)/(πt), impulse δ(t).",
"Impulse: ∫δ=1; sifting x(t)δ(t−t₀)=x(t₀)δ(t−t₀); sampling ∫x(t)δ(t−t₀)dt=x(t₀); δ(t)=du/dt.",
"Operations: time shift x(t−t₀) (delay for t₀&gt;0), time reversal x(−t), time scaling x(at) (a&gt;1 contracts).",
"Classes: continuous/discrete time, deterministic/random, periodic (x(t)=x(t+T₀)), causal/noncausal, even/odd, energy-type/power-type.",
"Energy Eₓ=∫|x|²dt; power Pₓ=lim (1/T)∫|x|²dt. Nonzero power ⇒ infinite energy.",
"Complex signals: Euler <code>e^{jφ}=cosφ+j sinφ</code>; cos φ=(e^{jφ}+e^{−jφ})/2. Real signals in practice, but complex notation is convenient."],
q:[{q:"x(t−2) compared with x(t) is…",o:["Advanced by 2","Delayed by 2","Compressed by 2","Reversed"],a:1,e:"For t₀>0, x(t−t₀) is shifted right, i.e. delayed."},
{q:"A periodic signal with nonzero finite power has…",o:["Finite energy","Infinite energy","Zero energy","Undefined power"],a:1,e:"Nonzero power implies infinite energy."},
{q:"∫x(t)δ(t−t₀)dt equals…",o:["x(0)","δ(t₀)","x(t₀)","1"],a:2,e:"Sampling property of the impulse."}]},

{t:"Review of Systems",w:"conv",pts:[
"A system maps an input x(t) to an output y(t)=𝒯[x(t)]. Examples: differentiator, amplifier y=ax, filter.",
"<b>Linear</b>: 𝒯[a₁x₁+a₂x₂]=a₁𝒯[x₁]+a₂𝒯[x₂]. y=x² is nonlinear.",
"<b>Time-invariant</b>: delayed input ⇒ delayed output. A modulator y=x(t)cos(2πf₀t) is time-variant.",
"<b>Causal</b>: output depends only on present and past input. A causal LTI system has a causal impulse response h(t).",
"An <b>LTI</b> system is fully characterized by its impulse response h(t); output is the convolution <code>y(t)=x(t)⊛h(t)=∫x(τ)h(t−τ)dτ</code>.",
"Convolution recipe: draw x(τ), h(τ) → flip &amp; shift h to h(t−τ) → multiply &amp; integrate.",
"Properties: commutative, associative, distributive; x⊛δ=x.",
"Complex sinusoids are <b>eigenfunctions</b> of LTI systems: e^{j2πf₀t} → H(f₀)e^{j2πf₀t}, with H(f₀)=∫h(τ)e^{−j2πf₀τ}dτ."],
q:[{q:"Which system is time-variant?",o:["y=ax(t)","y=dx/dt","y=x(t)cos(2πf₀t)","y=x(t−1)"],a:2,e:"Multiplying by a time-dependent carrier breaks time invariance."},
{q:"The output of an LTI system with impulse response h(t) is…",o:["x·h","x⊛h","x+h","dx/dt"],a:1,e:"Convolution of input and impulse response."},
{q:"Complex sinusoids passing through an LTI system…",o:["Change frequency","Keep frequency, change amplitude/phase","Become real","Vanish"],a:1,e:"Eigenfunction property: scaled by H(f₀)."}]},

{t:"Fourier Series",w:"four",pts:[
"A periodic x(t) (period T₀=1/f₀) can be written <code>x(t)=Σₖ xₖ e^{j2πkf₀t}</code> – a sum of harmonically related complex sinusoids.",
"Coefficients: <code>xₖ=(1/T₀)∫₍T₀₎ x(t)e^{−j2πkf₀t}dt</code>. Example: cos(2πf₀t) has xₖ=½ for k=±1, else 0.",
"Real x(t) ⇒ x₋ₖ=xₖ* (Hermitian): |xₖ| even, ∠xₖ odd. Even signals have only cosine terms; odd signals only sine terms.",
"Spectrum plots: magnitude |xₖ| vs k, phase ∠xₖ vs k, power |xₖ|² vs k.",
"Dirichlet conditions (sufficient): absolutely integrable over a period; finite maxima/minima and finite discontinuities per period.",
"LTI response to a periodic input: output coefficients are <code>xₖH(kf₀)</code> – no new frequencies appear.",
"Parseval: (1/T₀)∫|x|²dt = Σ|xₖ|² – power is conserved."],
q:[{q:"If x(t) is real, its Fourier coefficients satisfy…",o:["x₋ₖ=xₖ","x₋ₖ=−xₖ","x₋ₖ=xₖ*","xₖ=0 for k<0"],a:2,e:"Hermitian symmetry."},
{q:"A periodic signal passes through an LTI system. The k-th output coefficient is…",o:["xₖ","xₖH(kf₀)","xₖ+H(kf₀)","H(xₖ)"],a:1,e:"Each harmonic is scaled by the frequency response at kf₀."}]},

{t:"Fourier Transform",w:"ft",pts:[
"For nonperiodic signals: <code>X(f)=∫x(t)e^{−j2πft}dt</code>, inverse <code>x(t)=∫X(f)e^{j2πft}df</code>.",
"|X(f)| = amplitude spectrum, ∠X(f) = phase spectrum. Real x(t) ⇒ X(−f)=X*(f). Real &amp; even ⇒ X real &amp; even; real &amp; odd ⇒ X imaginary &amp; odd.",
"Bandwidth: width of the frequency range where |X(f)|≠0; baseband signals have f_L≈0.",
"Pairs: Π(t)↔sinc(f); δ(t)↔1; 1↔δ(f); Λ(t)↔sinc²(f); cos(2πf₀t)↔½δ(f−f₀)+½δ(f+f₀); e^{−αt}u(t)↔1/(α+j2πf).",
"Properties: linearity, duality, time shift ↔ e^{−j2πft₀}X(f), scaling x(at)↔(1/|a|)X(f/a), modulation e^{j2πf₀t}x(t)↔X(f−f₀), convolution ↔ multiplication, differentiation ↔ (j2πf)ⁿX(f).",
"Parseval: ∫|x|²dt=∫|X|²df; |X(f)|² is the energy spectral density.",
"LTI systems: <code>Y(f)=H(f)X(f)</code>. Ideal LPF/HPF/BPF have H=1 in the pass band and 0 elsewhere (a linear phase e^{−j2πft_d} is still ideal)."],
q:[{q:"The Fourier transform of Π(t) is…",o:["sinc(f)","Π(f)","1","sinc²(f)"],a:0,e:"A unit rectangular pulse transforms to a sinc."},
{q:"Multiplying x(t) by e^{j2πf₀t} does what to the spectrum?",o:["Scales it","Shifts it by f₀","Reverses it","Nothing"],a:1,e:"Modulation property: X(f−f₀)."},
{q:"Expanding a signal in time (a<1) makes its spectrum…",o:["Wider","Narrower","Unchanged","Imaginary"],a:1,e:"Time scaling: compression in time ⇒ expansion in frequency, and vice versa."}]},

{t:"Double-Sideband AM",w:"am",pts:[
"Modulation turns a lowpass message m(t) (bandwidth W) into a bandpass signal near carrier f_c: x(t)=A(t)cos(2πf_ct+φ(t)). AM varies A(t); angle modulation varies φ(t).",
"Why modulate: match channel/regulation, use smaller antennas, allow multiple transmitters on different f_c, trade bandwidth for noise immunity.",
"<b>DSB-SC</b>: x(t)=A_c m(t)cos(2πf_ct); X(f)=(A_c/2)[M(f−f_c)+M(f+f_c)]; bandwidth 2W; power P=(A_c²/2)P_m.",
"Coherent demodulation: multiply by cos(2πf_ct+φ) then LPF → (A_c/2)m(t)cosφ. φ=π/2 makes the message vanish ⇒ need synchronization (pilot tone or PLL).",
"<b>Conventional AM</b>: x(t)=A_c[1+a·mₙ(t)]cos(2πf_ct), |mₙ|≤1, index a∈(0,1) ⇒ envelope follows the message ⇒ simple envelope detector.",
"Conventional AM power: (A_c²/2)a²P_mₙ + A_c²/2 (carrier) – less efficient than DSB-SC.",
"Envelope detector needs 1/f_c ≪ RC ≪ 1/W. Too small RC ⇒ ripple; too large ⇒ output stuck.",
"Implementations: power-law (nonlinear device + BPF) modulator; balanced modulator (difference of two conventional AM signals = DSB-SC)."],
q:[{q:"Bandwidth of a DSB AM signal with message bandwidth W is…",o:["W","2W","4W","W/2"],a:1,e:"Both sidebands are transmitted."},
{q:"In coherent DSB-SC demodulation, a 90° LO phase error gives…",o:["Half the power","No distortion","Zero output","Double output"],a:2,e:"The output is scaled by cos φ; cos(π/2)=0."},
{q:"Why must |a·mₙ(t)| ≤ 1 in conventional AM?",o:["To save power","So the envelope stays non-negative and detectable","To shift f_c","To reduce bandwidth"],a:1,e:"Otherwise it is over-modulated and an envelope detector fails."}]},

{t:"Frequency Modulation",w:"fm",pts:[
"Angle modulation: x(t)=A_c cos(2πf_ct+φ(t)); instantaneous frequency f_i=f_c+(1/2π)dφ/dt.",
"PM: φ=k_p m(t). FM: frequency deviation Δf(t)=k_f m(t), so φ(t)=2πk_f∫m(τ)dτ. FM of m = PM of ∫m.",
"Benefits: better noise immunity than AM and constant envelope (good with nonlinear amplifiers). Carson showed FM needs more bandwidth; Armstrong showed its noise immunity.",
"Modulation index <code>β_f = k_f max|m(t)| / W</code>. For m=a cos(2πf_mt): β=k_f a/f_m.",
"Spectrum for sinusoidal m: <code>Σ A_c Jₙ(β)cos(2π(f_c+nf_m)t)</code> (Bessel functions); ΣJₙ²=1; infinitely many components.",
"<b>Carson's rule</b>: effective bandwidth B=2(β+1)W (≈98% of power). Narrowband FM β≪1 (B≈2W); wideband β≫1.",
"Commercial FM: 200 kHz spacing, 75 kHz peak deviation. 1G cellular used FM.",
"Generation: direct (VCO) or indirect (narrowband FM + frequency multiplier). Demodulation: differentiator + envelope detector (discriminator) or a PLL."],
q:[{q:"Carson's rule gives bandwidth B =",o:["2W","2(β+1)W","(β+1)W/2","βW"],a:1,e:"B=2(β_f+1)W."},
{q:"An FM modulator fed with dm/dt produces…",o:["An AM signal","A PM signal","DSB-SC","Noise"],a:1,e:"Differentiating before FM gives PM."},
{q:"k_f=3, max|m|=1, W=1. β_f is…",o:["1","3","6","0.33"],a:1,e:"β = k_f·max|m|/W = 3."}]},

{t:"Sampling &amp; Reconstruction",w:"samp",pts:[
"Digital systems need discrete time <i>and</i> discrete amplitude: sampler → quantizer.",
"Uniform sampling: x_s(t)=Σx(nT_s)δ(t−nT_s), f_s=1/T_s. Spectrum = copies of X(f) every f_s: (1/T_s)ΣX(f−n/T_s).",
"<b>Nyquist theorem</b>: a signal bandlimited to W can be reconstructed if f_s ≥ 2W (the Nyquist rate is 2W).",
"Reconstruction: sinc interpolation x(t)=Σx_d[n]sinc(t/T_s−n) for T_s=1/(2W) – equivalent to an ideal LPF.",
"If f_s &lt; 2W the replicas overlap: <b>aliasing</b>. Sample above 2W to leave a guard band because real filters are not ideal.",
"Non-bandlimited signals: apply an <b>antialiasing LPF</b> first. Speech: filter ≤4 kHz, sample 8 kHz. Music: up to 20 kHz, sample 44.1 kHz.",
"Quantization: m-bit ⇒ 2^m levels (e.g. 3 bits → 0…7). ADC = sampler + quantizer; analog→discrete-time quantized signal is <b>PCM</b>. Practical samplers use sample-and-hold."],
q:[{q:"x(t)=cos(2πt) has W=1 Hz. The minimum sampling rate for reconstruction is…",o:["1 Hz","2 Hz","4/3 Hz","10 Hz"],a:1,e:"Nyquist rate 2W=2 Hz."},
{q:"Aliasing occurs when…",o:["f_s>2W","f_s<2W","Quantizing with many bits","The LPF is ideal"],a:1,e:"Spectral replicas overlap."},
{q:"How many levels does 8-bit quantization have?",o:["8","64","255","256"],a:3,e:"2⁸=256 (values 0…255)."}]},

{t:"SSB AM &amp; Broadcasting",w:"super",pts:[
"Real m(t) ⇒ M(f) Hermitian, so one sideband carries all the information. SSB sends one sideband (bandwidth W instead of 2W).",
"Method 1: DSB-SC followed by a sharp BPF. Method 2: Hilbert filter H(f)=−j·sign(f), <code>x(t)=A_c m(t)cos(2πf_ct) ± A_c m̃(t)sin(2πf_ct)</code> (− USB, + LSB).",
"SSB demodulation is coherent; LO phase error leaves a distortion term ∝ m̃(t)sinφ; a pilot tone helps.",
"<b>VSB</b>: a non-ideal BPF keeps a vestige of the other sideband. Works if H(f−f_c)+H(f+f_c)=constant for |f|≤W. Used for TV (preserves DC).",
"<b>AM radio</b>: conventional AM, 535–1605 kHz, 10 kHz channels (W=5 kHz). Superheterodyne receiver converts any station to a fixed IF = 455 kHz; f_LO=f_c+f_IF.",
"Image channel at f_c′=f_c+2f_IF is removed by the RF amplifier. Example: f_c=740 kHz ⇒ f_LO=1195 kHz, image=1650 kHz.",
"<b>FM radio</b>: 88–108 MHz, 200 kHz spacing, 75 kHz deviation, IF=10.7 MHz; limiter removes amplitude noise, discriminator demodulates.",
"Stereo FM: L+R and L−R (DSB-AM at a higher subcarrier) + pilot, then FM; receiver recovers L and R by adding/subtracting."],
q:[{q:"Superheterodyne AM receiver tuned to 740 kHz (IF 455 kHz) has f_LO =",o:["285 kHz","740 kHz","1195 kHz","1650 kHz"],a:2,e:"f_LO=f_c+f_IF=1195 kHz; image is at 1650 kHz."},
{q:"SSB AM bandwidth for message bandwidth W is…",o:["W","2W","W/2","4W"],a:0,e:"Only one sideband is sent."},
{q:"Why is VSB used for TV?",o:["It needs more bandwidth","It allows DC values without sharp filtering","It is FM","It removes the carrier"],a:1,e:"Images need DC; VSB avoids the sharp cutoff of SSB."}]},

{t:"Multiplexing &amp; Noise",w:"iq",pts:[
"<b>Multiplexing</b> combines simultaneous transmissions: quadrature-carrier, frequency-division (FDM), time-division (TDM).",
"<b>Quadrature-carrier (I/Q)</b>: x(t)=m_I cos(2πf_ct)−m_Q sin(2πf_ct)=Re[m(t)e^{j2πf_ct}], m=m_I+jm_Q. Two AM signals share the same band without interference. SDR hardware (USRP) uses this; PSK/QAM build on it.",
"AM: m_Q=0. FM: m_I=cos φ, m_Q=sin φ. SSB: m_Q=±m̃.",
"<b>FDM</b>: each message modulates its own carrier, BPFs separate them. For DSB, carrier spacing must exceed 2W.",
"<b>Noise</b>: random signal; thermal noise has a flat PSD S(f)=N₀/2 with N₀=kT (&lsquo;white&rsquo;). Power = integral of the PSD over the band.",
"DSB AM with bandlimited noise: n=n_c cos−n_s sin; after demod y=½A_c m+½n_c; <b>SNR = Pₓ/(N₀W)</b>. SSB has the same SNR; conventional AM is lower by the factor a²P_mₙ/(1+a²P_mₙ).",
"Angle modulation: noise effect is ∝1/A_c – raising carrier amplitude reduces it (unlike AM). FM/PM SNR scales with (Ω/2−1)²·Pₓ/(N₀W) where Ω=2(β+1).",
"Trade-offs: SSB-SC most bandwidth-efficient; FM most power-efficient (noise immunity); conventional AM and FM are simple to build."],
q:[{q:"A flat power spectral density is called…",o:["Pink noise","White noise","Quantization noise","Aliasing"],a:1,e:"Thermal noise is white: S(f)=N₀/2."},
{q:"In FDM with DSB AM (message bandwidth W), carrier spacing must be…",o:["< W","= W","> 2W","irrelevant"],a:2,e:"Each DSB signal occupies 2W."},
{q:"Increasing A_c in FM…",o:["Does nothing","Reduces the effect of noise","Increases noise effect","Doubles bandwidth"],a:1,e:"Noise effect is inversely proportional to A_c in angle modulation."}]}
];

// Blue-on-dark "futuristic" SVG figures: lecture thumbnails + cover-page figures
const C1='#1d6dff',C2='#38bdf8',C3='#7dd3fc',C4='#4f6bff';
const sinc2=x=>x==0?1:Math.sin(Math.PI*x)/(Math.PI*x),nz=x=>.6*Math.sin(x*3.7)+.5*Math.sin(x*7.9+1)+.4*Math.sin(x*13.1+2)+.3*Math.sin(x*23.3);
const PA=(f,a,b,n)=>{let d='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;d+=(i?'L':'M')+x.toFixed(1)+' '+f(x).toFixed(1)}return d};
const PL=(d,c,w=2,ex='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)" ${ex}/>`;
const TX=(x,y,s,sz=12,an='start',c=C3)=>`<text x="${x}" y="${y}" fill="${c}" font-family="ui-monospace,Menlo,monospace" font-size="${sz}" text-anchor="${an}">${s}</text>`;
const BX=(x,y,w,h,c=C2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="rgba(29,109,255,.14)" stroke="${c}" stroke-width="1.6" filter="url(#gl)"/>`;
const AR=(x1,y1,x2,y2,c=C2)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${c}" stroke-width="1.8" filter="url(#gl)"/><path d="M${x2-7} ${y2-5}L${x2} ${y2}L${x2-7} ${y2+5}" fill="none" stroke="${c}" stroke-width="1.8"/>`;
function SV(w,h,inner,label){let g='';for(let x=0;x<=w;x+=20)g+=`M${x} 0V${h}`;for(let y=0;y<=h;y+=20)g+=`M0 ${y}H${w}`;
 return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040a18"/><stop offset="1" stop-color="#0b1f4a"/></linearGradient><filter id="gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="${w}" height="${h}" fill="url(#bg)"/><path d="${g}" stroke="${C1}" stroke-opacity=".13" stroke-width="1" fill="none"/>${inner}</svg>`}
const THUMBS=[

<div class="card inst"><div><b>Dr. Anas Chaaban, P.Eng.</b><br>School of Engineering, University of British Columbia (UBC)<br>✉ <a href="mailto:anas.chaaban@ubc.ca">anas.chaaban@ubc.ca</a><br>Office: EME 3215 · Tuesdays 11–4 pm (email first to confirm)</div>

<div class="hero">${FIG.hero()}</div></section>
<h2>What is this course about?</h2>
${P('<b>Communication</b> is the task of delivering information from a source (transmitter) to a destination (receiver) in a <b>recognizable form</b>. Information comes as audio, video, text and more, and the systems that carry it include broadcast (radio, TV), wired (telephone, cable), mobile (satellite, cellular) and networked systems (internet, sensors, IoT). This course covers the underlying techniques that make these systems work.')}
<h3>Elements of a communication system</h3>
<ul><li><b>Source</b> – generates the information (analog: voice, video; digital: text, files).</li><li><b>Transmitter</b> – converts it into an electrical/electromagnetic/optical signal suited to the channel, using resources such as power, bandwidth, time, space (antennas), computation and infrastructure. Good schemes use these efficiently, which often means trade-offs.</li><li><b>Channel</b> – the physical medium (wire, fibre, free space, air, water). It <b>distorts</b> the signal with random noise/interference.</li><li><b>Receiver</b> – extracts the transmitted information from the distorted signal. Building the transmit signal and processing the received one relies on signals-and-systems concepts, covered here.</li></ul>
${FG('ch')}<div id="introw"></div>
<h3>Classifying communication systems</h3>
<ul><li><b>Analog vs digital</b> – continuous signals sent directly with <i>analog modulation</i> (AM, FM) versus discrete signals (bits) sent with <i>digital modulation</i>.</li><li><b>Wired vs wireless</b>; <b>single-user</b> (point-to-point) vs <b>multi-user</b> (broadcasting, multicasting); direction: uplink/downlink, full- or half-duplex; also bandwidth, range, power…</li></ul>
${FG('ad')}
<h3>Why analog communication?</h3>
${P('Analog communication developed mainly in the early 20th century and is still used for radio and TV broadcasting. It is also a building block of digital systems, and many digital-communication developments build on analog concepts. Cables (twisted pair, coaxial), radio waves and acoustic waves can all carry analog signals. The course helps with understanding RF integrated circuits, digital communication and wireless networking, with emerging applications such as biomedical engineering and IoT, with jobs in the telecom industry, and with graduate studies and internships. Expect a fair amount of mathematics, plus implementation of schemes in GNU Radio and software-defined radios (SDR).')}

conv:{t:"Try it: convolution y(t)=x(t)⊛h(t) step by step",h:380,sel:[["x","Input x(τ)",SN,0],["h","Impulse response h(τ)",SN,1]],sl:[["t","Time t",-3,5,.1,.5]],
 d(c,v){const x=SIG[v.x][1],h=SIG[v.h][1],cv=t=>{let a=0;for(let u=-5;u<7;u+=.02)a+=x(u)*h(t-u)*.02;return a},hs=t=>h(v.t-t);
  let ym=.01;for(let t=-3;t<=5;t+=.1)ym=Math.max(ym,cv(t));const cur=cv(v.t);c.getContext('2d').clearRect(0,0,720,380);
  plot(c,[{f:t=>x(t)*hs(t),c:G,fill:1,lw:1},{f:x,c:A},{f:hs,c:R}],-3,5,-.2,1.3,[0,190]);
  plot(c,[{f:cv,c:A,lw:1,d:[3,3]},{f:cv,c:A,lw:3,to:v.t},{pts:[[v.t,cur]],stem:1,c:R}],-3,5,-.15*ym,1.2*ym,[200,180]);
  return`Top: x(τ) (blue), flipped &amp; shifted h(t−τ) (red), and their product (green area). Bottom: y(t) is that area, traced out as t moves. At t=${v.t.toFixed(1)}: y=<b>${cur.toFixed(3)}</b>.`}},
ft:{t:"Try it: scaling, shifting and modulation of a pulse",h:340,sl:[["tau","Pulse width τ",.25,3,.25,1],["t0","Time shift t₀",-1.5,1.5,.25,0],["f0","Modulate with cos(2πf₀t), f₀",0,4,.5,0]],
 d(c,v){const{tau,t0,f0}=v,xt=t=>Math.abs((t-t0)/tau)<=.5?Math.cos(2*Math.PI*f0*t):0,
  A_=g=>{const s=tau*sinc(g*tau),p=2*Math.PI*g*t0;return[s*Math.cos(p),-s*Math.sin(p)]},
  X=f=>{const a=A_(f-f0),b=A_(f+f0);return Math.hypot(a[0]+b[0],a[1]+b[1])/2};c.getContext('2d').clearRect(0,0,720,340);
  plot(c,[{f:xt,c:A,lw:1.5}],-3,3,-1.4,1.4,[0,150]);plot(c,[{f:X,c:R,fill:1}],-8,8,-.1*tau-.02,1.15*tau,[170,170]);
  return`Top: x(t)=Π((t−t₀)/τ)·cos(2πf₀t). Bottom: |X(f)|. <b>Scaling</b>: widening the pulse (τ↑) narrows the spectrum (main lobe ≈ 2/τ wide). <b>Shift</b>: t₀ changes only the phase, |X(f)| stays identical. <b>Modulation</b>: |X(f)| moves to ±f₀.`}},
super:{t:"Try it: superheterodyne receiver – image frequency",h:300,sl:[["fc","Desired station f_c (kHz)",540,1600,10,740],["fi","Intermediate frequency f_IF (kHz)",100,1000,5,455]],
 d(c,v){const{fc,fi}=v,lo=fc+fi,im=fc+2*fi,x=c.getContext('2d'),w=c.width,mx=Math.max(2200,im+300),X=f=>30+f/mx*(w-60),fg=getComputedStyle(document.body).getPropertyValue('--fg');
  x.clearRect(0,0,w,300);x.font='13px system-ui';x.fillStyle='rgba(120,140,200,.2)';x.fillRect(X(535),30,X(1605)-X(535),100);
  const ax=y=>{x.strokeStyle=fg;x.lineWidth=1;x.setLineDash([]);x.beginPath();x.moveTo(30,y);x.lineTo(w-30,y);x.stroke()},
   bar=(f,y,hh,col,l,dy)=>{x.strokeStyle=x.fillStyle=col;x.lineWidth=4;x.beginPath();x.moveTo(X(f),y);x.lineTo(X(f),y-hh);x.stroke();x.fillText(l,Math.min(X(f)-20,w-130),y-hh-4-(dy||0))};
  x.fillStyle=fg;x.fillText('Before mixer (RF)  – shaded: AM band 535–1605 kHz',30,18);ax(130);bar(fc,130,70,A,'desired '+fc);bar(lo,130,45,G,'LO '+lo);bar(im,130,70,R,'image '+im,0);
  x.fillStyle=fg;x.fillText('After mixer (IF)',30,175);ax(270);bar(fi,270,70,A,'desired → '+fi,16);bar(fi,270,50,R,'image → '+fi);
  [0,500,1000,1500,2000].filter(f=>f<mx).forEach(f=>{x.fillStyle=fg;x.fillText(f,X(f)-10,146);x.fillText(f,X(f)-10,286)});
  return`f_LO = f_c+f_IF = <b>${lo} kHz</b>; image f_c′ = f_c+2f_IF = <b>${im} kHz</b>. Both f_LO−f_c and f_c′−f_LO equal ${fi} kHz, so the mixer cannot tell them apart. ${im<=1605?'<span class="bad">The image lies inside the AM band: the RF amplifier must reject it before mixing.</span>':'The image is above the AM band, so it is easy to reject.'}`}},
iq:{t:"Try it: I/Q multiplexing and LO phase error",h:320,sl:[["p","Receiver LO phase error φ (degrees)",0,90,5,0]],
 d(c,v){const p=v.p*Math.PI/180,mi=t=>Math.cos(2*Math.PI*t),mq=t=>Math.sin(4*Math.PI*t);c.getContext('2d').clearRect(0,0,720,320);
  plot(c,[{f:t=>mi(t)/2,c:R,d:[5,4]},{f:t=>(mi(t)*Math.cos(p)+mq(t)*Math.sin(p))/2,c:A}],0,2,-.7,.7,[0,155]);
  plot(c,[{f:t=>mq(t)/2,c:R,d:[5,4]},{f:t=>(-mi(t)*Math.sin(p)+mq(t)*Math.cos(p))/2,c:G}],0,2,-.7,.7,[165,155]);
  return`Two independent messages share one carrier: x(t)=m_I cos(2πf_ct)−m_Q sin(2πf_ct). Top: I-branch output (blue) vs the target m_I/2 (red dashed). Bottom: Q-branch (green) vs m_Q/2. With φ=0 there is no interference; with φ=${v.p}° each branch loses cos φ=${Math.cos(p).toFixed(2)} of its message and picks up sin φ=${Math.sin(p).toFixed(2)} of the other.`}}});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',show);show();
